[package]
name = "rusty-modbus-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rusty-modbus-types = { path = "../crates/rusty-modbus-types" }
rusty-modbus-codec = { path = "../crates/rusty-modbus-codec" }
rusty-modbus-frame = { path = "../crates/rusty-modbus-frame", features = ["rtu"] }
rusty-modbus-tcp = { path = "../crates/rusty-modbus-tcp" }
rusty-modbus-rtu = { path = "../crates/rusty-modbus-rtu" }
rusty-modbus-tls = { path = "../crates/rusty-modbus-tls" }
rusty-modbus-client = { path = "../crates/rusty-modbus-client" }
rusty-modbus-server = { path = "../crates/rusty-modbus-server" }
rusty-modbus-sim = { path = "../crates/rusty-modbus-sim" }
rusty-modbus-pool = { path = "../crates/rusty-modbus-pool", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
criterion = { version = "0.5", features = ["async_tokio"] }
bytes = "1"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
rcgen = "0.14"
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-util = { version = "0.7", features = ["codec"] }

[[bin]]
name = "stress-test"
path = "src/bin/stress_test.rs"

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "server_store"
harness = false

[[bench]]
name = "server_handler"
harness = false

[[bench]]
name = "tcp_latency"
harness = false

[[bench]]
name = "tcp_throughput"
harness = false

[[bench]]
name = "tcp_pool"
harness = false

[[bench]]
name = "tls_latency"
harness = false

[[bench]]
name = "tls_throughput"
harness = false

[[bench]]
name = "rtu_tcp_latency"
harness = false

[[bench]]
name = "rtu_tcp_throughput"
harness = false
