[package]
name = "rusty-modbus-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Modbus/TCP Security — TLS 1.3 transport with mutual authentication"
readme = "README.md"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types", version = "0.1.0" }
rusty-modbus-codec = { path = "../rusty-modbus-codec", version = "0.1.0" }
rusty-modbus-frame = { path = "../rusty-modbus-frame", version = "0.1.0" }
rusty-modbus-tcp = { path = "../rusty-modbus-tcp", version = "0.1.0" }
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
x509-parser = "0.18"
bytes = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-util = { version = "0.7", features = ["codec"] }
webpki-roots = "1"
tracing = { version = "0.1.44", features = ["attributes"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rcgen = "0.14"
tempfile = "3"
rusty-modbus-codec = { path = "../rusty-modbus-codec" }
rusty-modbus-client = { path = "../rusty-modbus-client" }
rusty-modbus-server = { path = "../rusty-modbus-server" }

[package.metadata.docs.rs]
all-features = true
