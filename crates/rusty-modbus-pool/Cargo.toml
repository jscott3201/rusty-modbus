[package]
name = "rusty-modbus-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Modbus connection pooling with health checks and backoff"
readme = "README.md"

[dependencies]
rusty-modbus-tcp = { path = "../rusty-modbus-tcp", version = "0.1.1" }
rusty-modbus-frame = { path = "../rusty-modbus-frame", version = "0.1.1" }
rusty-modbus-client = { path = "../rusty-modbus-client", version = "0.1.1", optional = true }
rusty-modbus-types = { path = "../rusty-modbus-types", version = "0.1.1", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt"] }
parking_lot = "0.12"
thiserror = "2"
tracing = { version = "0.1.44", features = ["attributes"] }

[features]
default = []
client = ["dep:rusty-modbus-client", "dep:rusty-modbus-types"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
bytes = "1"
rusty-modbus-types = { path = "../rusty-modbus-types" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[package.metadata.docs.rs]
all-features = true
