[package]
name = "rusty-modbus-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Modbus connection pooling with health checks and backoff"
readme = "README.md"

[dependencies]
rusty-modbus-tcp = { path = "../rusty-modbus-tcp", version = "0.1.1" }
rusty-modbus-frame = { path = "../rusty-modbus-frame", version = "0.1.1" }
rusty-modbus-client = { path = "../rusty-modbus-client", version = "0.1.1", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt"] }
parking_lot = "0.12"
thiserror = "2"

[features]
default = []
client = ["dep:rusty-modbus-client"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
rusty-modbus-types = { path = "../rusty-modbus-types" }

[package.metadata.docs.rs]
all-features = true
