[package]
name = "modbus-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "modbus"
path = "src/main.rs"

[dependencies]
rusty-modbus = { path = "../rusty-modbus", features = ["full"] }
modbus-types = { path = "../modbus-types" }
modbus-client = { path = "../modbus-client" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "15"
ipnet = "2"

[dev-dependencies]
modbus-sim = { path = "../modbus-sim" }
