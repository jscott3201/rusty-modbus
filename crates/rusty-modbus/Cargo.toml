[package]
name = "rusty-modbus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Complete Modbus protocol stack — TCP, RTU, TLS"

[dependencies]
modbus-types = { path = "../modbus-types" }
modbus-codec = { path = "../modbus-codec" }
modbus-frame = { path = "../modbus-frame" }
modbus-tcp = { path = "../modbus-tcp", optional = true }
modbus-rtu = { path = "../modbus-rtu", default-features = false, optional = true }
modbus-pool = { path = "../modbus-pool", optional = true }
modbus-client = { path = "../modbus-client", optional = true }
modbus-server = { path = "../modbus-server", optional = true }
modbus-gateway = { path = "../modbus-gateway", optional = true }
modbus-tls = { path = "../modbus-tls", optional = true }

[features]
default = ["tcp"]
tcp = ["dep:modbus-tcp", "dep:modbus-client", "modbus-client/tcp"]
rtu = ["dep:modbus-rtu"]
rtu-tcp = ["rtu"]
tls = ["dep:modbus-tls"]
server = ["dep:modbus-server"]
gateway = ["dep:modbus-gateway", "rtu"]
pool = ["dep:modbus-pool"]
full = ["tcp", "rtu", "rtu-tcp", "tls", "server", "gateway", "pool"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
