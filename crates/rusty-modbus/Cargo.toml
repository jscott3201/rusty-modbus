[package]
name = "rusty-modbus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Modular Modbus protocol stack — TCP, RTU, TLS"
readme = "README.md"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types", version = "0.1.1" }
rusty-modbus-codec = { path = "../rusty-modbus-codec", version = "0.1.1" }
rusty-modbus-frame = { path = "../rusty-modbus-frame", version = "0.1.1" }
rusty-modbus-tcp = { path = "../rusty-modbus-tcp", version = "0.1.1", optional = true }
rusty-modbus-rtu = { path = "../rusty-modbus-rtu", version = "0.1.1", default-features = false, optional = true }
rusty-modbus-pool = { path = "../rusty-modbus-pool", version = "0.1.1", optional = true }
rusty-modbus-client = { path = "../rusty-modbus-client", version = "0.1.1", optional = true }
rusty-modbus-server = { path = "../rusty-modbus-server", version = "0.1.1", optional = true }
rusty-modbus-gateway = { path = "../rusty-modbus-gateway", version = "0.1.1", optional = true }
rusty-modbus-tls = { path = "../rusty-modbus-tls", version = "0.1.1", optional = true }

[features]
default = ["tcp"]
tcp = ["dep:rusty-modbus-tcp", "dep:rusty-modbus-client", "rusty-modbus-client/tcp"]
rtu = ["dep:rusty-modbus-rtu"]
rtu-serial = ["rtu", "rusty-modbus-rtu/serial"]
rtu-tcp = ["rtu"]
tls = ["dep:rusty-modbus-tls"]
server = ["dep:rusty-modbus-server"]
gateway = ["dep:rusty-modbus-gateway", "rtu"]
pool = ["dep:rusty-modbus-pool", "rusty-modbus-pool/client"]
full = ["tcp", "rtu", "rtu-serial", "rtu-tcp", "tls", "server", "gateway", "pool"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"

[package.metadata.docs.rs]
all-features = true
