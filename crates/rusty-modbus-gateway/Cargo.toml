[package]
name = "rusty-modbus-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Modbus TCP-to-RTU gateway bridge"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types" }
rusty-modbus-codec = { path = "../rusty-modbus-codec" }
rusty-modbus-frame = { path = "../rusty-modbus-frame", features = ["rtu"] }
rusty-modbus-tcp = { path = "../rusty-modbus-tcp" }
rusty-modbus-rtu = { path = "../rusty-modbus-rtu", default-features = false }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
bytes = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusty-modbus-client = { path = "../rusty-modbus-client" }
rusty-modbus-server = { path = "../rusty-modbus-server" }
