[package]
name = "modbus-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
modbus-types = { path = "../modbus-types" }
modbus-codec = { path = "../modbus-codec" }
modbus-frame = { path = "../modbus-frame", features = ["rtu"] }
modbus-tcp = { path = "../modbus-tcp" }
modbus-rtu = { path = "../modbus-rtu", default-features = false }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
bytes = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
modbus-client = { path = "../modbus-client" }
modbus-server = { path = "../modbus-server" }
