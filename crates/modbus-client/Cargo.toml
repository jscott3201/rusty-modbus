[package]
name = "modbus-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
modbus-types = { path = "../modbus-types" }
modbus-codec = { path = "../modbus-codec" }
modbus-frame = { path = "../modbus-frame" }
modbus-tcp = { path = "../modbus-tcp" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
bytes = "1"
thiserror = "2"
parking_lot = "0.12"

[features]
default = ["tcp"]
tcp = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
modbus-types = { path = "../modbus-types" }
zerocopy = "0.8"
