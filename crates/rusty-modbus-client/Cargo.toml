[package]
name = "rusty-modbus-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pipelined async Modbus client"
readme = "README.md"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types", version = "0.1.0" }
rusty-modbus-codec = { path = "../rusty-modbus-codec", version = "0.1.0" }
rusty-modbus-frame = { path = "../rusty-modbus-frame", version = "0.1.0" }
rusty-modbus-tcp = { path = "../rusty-modbus-tcp", version = "0.1.0" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
bytes = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = { version = "0.1.44", features = ["attributes"] }

[features]
default = ["tcp"]
tcp = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
rusty-modbus-types = { path = "../rusty-modbus-types" }
zerocopy = "0.8"

[package.metadata.docs.rs]
all-features = true
