[package]
name = "rusty-modbus-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pipelined async Modbus client"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types" }
rusty-modbus-codec = { path = "../rusty-modbus-codec" }
rusty-modbus-frame = { path = "../rusty-modbus-frame" }
rusty-modbus-tcp = { path = "../rusty-modbus-tcp" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
bytes = "1"
thiserror = "2"
parking_lot = "0.12"

[features]
default = ["tcp"]
tcp = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
rusty-modbus-types = { path = "../rusty-modbus-types" }
zerocopy = "0.8"
