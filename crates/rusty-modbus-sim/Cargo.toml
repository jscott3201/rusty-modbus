[package]
name = "rusty-modbus-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "YAML-driven Modbus device simulator"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types", features = ["serde"] }
rusty-modbus-server = { path = "../rusty-modbus-server" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
rand = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rusty-modbus-client = { path = "../rusty-modbus-client" }
