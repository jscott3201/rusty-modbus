[package]
name = "rusty-modbus-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "YAML-driven Modbus device simulator"
readme = "README.md"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types", version = "0.1.1", features = ["serde"] }
rusty-modbus-server = { path = "../rusty-modbus-server", version = "0.1.1" }
tokio = { version = "1", features = ["rt", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rusty-modbus-client = { path = "../rusty-modbus-client" }

[package.metadata.docs.rs]
all-features = true
