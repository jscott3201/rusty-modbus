[package]
name = "modbus-rtu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
modbus-types = { path = "../modbus-types" }
modbus-codec = { path = "../modbus-codec" }
modbus-frame = { path = "../modbus-frame", features = ["rtu"] }
modbus-tcp = { path = "../modbus-tcp" }
tokio = { version = "1", features = ["net", "rt", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = { version = "0.5", features = ["all"] }
tokio-serial = { version = "5", optional = true }

[features]
default = ["serial"]
serial = ["dep:tokio-serial"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
