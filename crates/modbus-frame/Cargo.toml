[package]
name = "modbus-frame"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
modbus-types = { path = "../modbus-types" }
modbus-codec = { path = "../modbus-codec" }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"
zerocopy = "0.8"

[features]
default = ["std"]
std = ["modbus-types/std", "modbus-codec/std"]
rtu = []
