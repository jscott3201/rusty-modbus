[package]
name = "rusty-modbus-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Modbus/TCP transport — split sink/stream traits and TCP implementation"

[dependencies]
rusty-modbus-types = { path = "../rusty-modbus-types" }
rusty-modbus-codec = { path = "../rusty-modbus-codec" }
rusty-modbus-frame = { path = "../rusty-modbus-frame" }
tokio = { version = "1", features = ["net", "rt", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
zerocopy = "0.8"
