# Dedicated gate for the workspace-excluded PyO3 bindings.

name: python

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/python.yml"
      - "scripts/ci-python.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "crates/rusty-modbus-client/**"
      - "crates/rusty-modbus-codec/**"
      - "crates/rusty-modbus-frame/**"
      - "crates/rusty-modbus-python/**"
      - "crates/rusty-modbus-server/**"
      - "crates/rusty-modbus-tcp/**"
      - "crates/rusty-modbus-tls/**"
      - "crates/rusty-modbus-types/**"
  workflow_dispatch:

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect python dependency changes
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - ".github/workflows/python.yml"
              - "Cargo.lock"
              - "Cargo.toml"
              - "deny.toml"
              - "crates/*/Cargo.toml"
              - "crates/rusty-modbus-python/Cargo.lock"

  wheel-test:
    name: wheel install + pytest (3.14)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rusty-modbus-python
      - name: install maturin
        working-directory: crates/rusty-modbus-python
        run: python -m pip install "maturin>=1.12,<2" pytest pytest-asyncio
      - name: build wheel
        working-directory: crates/rusty-modbus-python
        run: maturin build --release --locked -o dist -i "$(command -v python)"
      - name: assert wheel tag
        working-directory: crates/rusty-modbus-python
        env:
          EXPECTED_TAG: "cp314-"
        run: |
          python - <<'PY'
          import glob
          import os

          wheels = glob.glob("dist/*.whl")
          expected = os.environ["EXPECTED_TAG"]
          assert wheels, "no wheels were built"
          assert any(expected in wheel for wheel in wheels), (expected, wheels)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-3.14
          path: crates/rusty-modbus-python/dist/*.whl
      - name: install wheel
        working-directory: crates/rusty-modbus-python
        run: python -m pip install --force-reinstall dist/*.whl
      - name: test installed wheel
        working-directory: crates/rusty-modbus-python
        run: pytest tests/ -v

  wheel-test-free-threaded:
    name: wheel install + pytest (3.14t)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rusty-modbus-python
      - name: install maturin
        working-directory: crates/rusty-modbus-python
        run: python -m pip install "maturin>=1.12,<2" pytest pytest-asyncio
      - name: build wheel
        working-directory: crates/rusty-modbus-python
        run: maturin build --release --locked -o dist -i "$(command -v python)"
      - name: assert wheel tag
        working-directory: crates/rusty-modbus-python
        env:
          EXPECTED_TAG: "cp314t"
        run: |
          python - <<'PY'
          import glob
          import os

          wheels = glob.glob("dist/*.whl")
          expected = os.environ["EXPECTED_TAG"]
          assert wheels, "no wheels were built"
          assert any(expected in wheel for wheel in wheels), (expected, wheels)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-3.14t
          path: crates/rusty-modbus-python/dist/*.whl
      - name: install wheel
        working-directory: crates/rusty-modbus-python
        run: python -m pip install --force-reinstall dist/*.whl
      - name: test installed wheel free-threaded
        working-directory: crates/rusty-modbus-python
        env:
          PYTHON_GIL: "0"
        run: pytest tests/ -v

  stubs:
    name: stubs
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    needs: wheel-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel-3.14
          path: crates/rusty-modbus-python/dist
      - name: install typing tools
        working-directory: crates/rusty-modbus-python
        run: python -m pip install mypy pyright
      - name: install wheel
        working-directory: crates/rusty-modbus-python
        run: python -m pip install --force-reinstall dist/*.whl
      - name: stubtest
        working-directory: crates/rusty-modbus-python
        run: python -m mypy.stubtest rusty_modbus --allowlist stubtest-allowlist.txt --ignore-unused-allowlist
      - name: pyright verifytypes
        working-directory: crates/rusty-modbus-python
        run: |
          SITE_PACKAGES=$(python - <<'PY'
          import site

          print(site.getsitepackages()[0])
          PY
          )
          PYTHONPATH="$SITE_PACKAGES" python -m pyright --verifytypes rusty_modbus

  supply-chain:
    name: python crate supply-chain
    needs: changes
    if: |
      (github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch')
      && (needs.changes.outputs.deps == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny python crate
        run: cargo deny --manifest-path crates/rusty-modbus-python/Cargo.toml check --config deny.toml bans licenses sources
      - name: cargo-audit python crate
        run: cargo audit --file crates/rusty-modbus-python/Cargo.lock --ignore RUSTSEC-2025-0134
