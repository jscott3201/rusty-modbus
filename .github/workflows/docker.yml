# Docker image validation for rusty-modbus.
#
# This gate is intentionally path-filtered so ordinary protocol/source PRs do
# not pay for container builds. Run it manually when Docker behavior needs a
# fresh image check against the current branch.

name: docker

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "README.md"
      - "scripts/bench-suite.sh"
      - "scripts/docker-*.sh"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-smoke:
    name: image smoke
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: scripts/docker-ci.sh
