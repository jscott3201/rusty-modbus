# On-demand Docker image validation for rusty-modbus.
#
# Cold Docker release builds are too expensive for the ordinary PR path. Keep
# this workflow available for explicit image checks and use `scripts/docker-ci.sh`
# locally before Docker-focused PRs.

name: docker

on:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-smoke:
    name: image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: scripts/docker-ci.sh
        env:
          RUSTY_MODBUS_DOCKER_CACHE: gha
          RUSTY_MODBUS_DOCKER_SKIP_BENCH: "1"
