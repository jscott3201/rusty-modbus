# Nightly + on-merge CI for rusty-modbus.
#
# Carries gates kept off the per-PR critical path:
#   - clippy + test on macos-latest  (dev-host validation without the per-PR
#                                      10x macOS billing on `dev` PRs)
#   - cargo-audit advisory-db drift  (catches advisories published against
#                                      UNCHANGED pinned deps — the PR-side audit
#                                      only runs at the release gate)
#
# Triggers:
#   - schedule  06:30 UTC daily   (accumulated advisory drift over time)
#   - push:main                   (post-merge double-check of main)
#   - workflow_dispatch           (on-demand)
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:).

name: nightly

on:
  schedule:
    - cron: '30 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  clippy-macos:
    name: clippy (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest + doctests
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --locked --doc

  audit:
    name: cargo-audit (advisory-db drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: advisory-db-${{ runner.os }}-
      # RUSTSEC-2025-0134: rustls-pemfile unmaintained (see release.yml audit job).
      - run: cargo audit --color always --ignore RUSTSEC-2025-0134
