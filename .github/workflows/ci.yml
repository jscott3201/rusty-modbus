# Per-PR CI gate for rusty-modbus — runs on PRs into `dev`.
#
# Workflow model: feature branch -> PR -> `dev` (this gate) -> release PR -> `main`
# (the comprehensive gate in release.yml). Nightly drift lives in nightly.yml,
# and tag-triggered crates.io publishing lives in publish.yml.
#
# This gate compiles + lints + tests on Linux (the common case) and runs
# cargo-deny only when dependency manifests change. The cross-platform matrix,
# cargo-audit, and feature-combination checks run at the release gate to keep
# everyday `dev` PRs fast. Install local hooks with `bash scripts/install-hooks.sh`.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:).

name: ci

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'benchmarks/Cargo.toml'
              - 'deny.toml'

  fmt:
    name: fmt
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Keep the test link step lean (avoids ubuntu `ld` mmap pressure).
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest + doctests
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --locked --doc

  deny:
    name: cargo-deny
    needs: changes
    # Skip when no dependency manifests changed (the common case for source-only PRs).
    if: |
      (github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
